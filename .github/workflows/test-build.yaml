name: Build Mobile Code-Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Uses native ARM64 to match your phone's processor architecture
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libx11-dev libxkbfile-dev libsecret-1-dev quilt libkrb5-dev jq

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply Submodule Patches
        run: quilt push -a

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Code-Server Wrapper
        run: npm run build

      - name: Build VS Code Core
        # The VERSION variable is strictly required by the internal build scripts
        run: VERSION=1.0.0 npm run build:vscode

      - name: Assemble Release Bundle
        # KEEP_MODULES ensures the Node.js environment is bundled safely inside
        run: KEEP_MODULES=1 npm run release

      - name: Package Artifact
        # This zips the contents of the newly generated 'release' directory
        run: tar -czf mobile-ide-build.tar.gz -C release .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-server-mobile
          path: mobile-ide-build.tar.gz

      - name: Build VS Code Frontend Assets
        run: |
          cd lib/vscode
          npx gulp compile-client
          npx gulp compile-extensions

      - name: Generate Product Metadata
        run: |
          cp lib/vscode/product.json lib/vscode/out/product.json 2>/dev/null || true
          cp product.json lib/vscode/product.json 2>/dev/null || true

      - name: Package Full Runtime Artifact
        run: |
          tar -czf mobile-ide-build.tar.gz \
            out/ \
            src/ \
            lib/vscode/ \
            node_modules/ \
            package.json \
            product.json

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-server-mobile
          path: mobile-ide-build.tar.gz
