name: Build Mobile Code-Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libx11-dev libxkbfile-dev libsecret-1-dev quilt libkrb5-dev rsync jq

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply Submodule Patches
        run: quilt push -a

      - name: Inject Mobile UX & MAC Address Fix
        run: |
          # 1. MAC Address Fix
          echo "export function getMac(): string { return '00:00:00:00:00:00'; }" > lib/vscode/src/vs/base/node/macAddress.ts
          
          # 2. Viewport Lock & Auto-Collapse Sidebar
          cat << 'EOF' >> lib/vscode/src/vs/code/browser/workbench/workbench.html
          <style>
            html, body, .monaco-workbench {
              position: fixed !important; top: 0 !important; bottom: 0 !important;
              left: 0 !important; right: 0 !important; width: 100vw !important;
              height: 100dvh !important; overflow: hidden !important;
            }
            .editor-instance, .monaco-scrollable-element {
              touch-action: pan-x pan-y !important;
            }
          </style>
          <script>
            window.addEventListener('load', () => {
              document.body.addEventListener('touchstart', (e) => {
                const editorPart = e.target.closest('.part.editor');
                if (editorPart) {
                  const sidebar = document.querySelector('.part.sidebar');
                  if (sidebar && sidebar.offsetWidth > 0) {
                    document.dispatchEvent(new KeyboardEvent('keydown', {
                      key: 'b', code: 'KeyB', ctrlKey: true, bubbles: true
                    }));
                  }
                }
              }, { passive: true });
            });
          </script>
          EOF

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Code-Server Wrapper
        run: npm run build

      - name: Build VS Code & Generate Production Release
        run: |
          export VERSION="1.0.0"
          npm run build:vscode
          npm run release

      - name: Install Production Runtime Modules
        run: |
          # Navigate into the clean release folder and install ONLY the required runtime packages
          cd release
          npm install --omit=dev

      - name: Package Optimized Release Artifact
        run: |
          tar -czf mobile-ide-build.tar.gz -C release .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-server-mobile
          path: mobile-ide-build.tar.gz
