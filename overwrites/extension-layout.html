<!-- Mobile UX: Extension Tab Layout Overrides -->
<style>
  /* 1. Break the flexbox container to allow the header to scroll naturally */
  .extension-editor {
    display: block !important;
    overflow-y: auto !important; 
    height: 100% !important;
  }

  /* 2. Allow the header text to wrap so it doesn't get trimmed */
  .extension-editor > .header {
    display: flex !important;
    min-width: 0 !important;
    max-width: 100% !important;
    height: auto !important; 
    padding: 15px 15px 0 15px !important;
    box-sizing: border-box !important;
    flex-wrap: wrap !important; 
  }
  .extension-editor > .header .details {
    min-width: 0 !important;
    overflow-wrap: break-word !important; 
    white-space: normal !important;
  }

  /* 3. The Viewport Trick: Force the body to be exactly the height of the screen.
        This gives the iframe strict boundaries to render within, while allowing 
        the header to safely scroll completely out of view above it. */
  .extension-editor > .body {
    display: block !important;
    height: 100% !important; 
    min-height: 75dvh !important; /* Failsafe height for the Webview iframe */
    position: relative !important;
    overflow: hidden !important; 
  }
</style>
