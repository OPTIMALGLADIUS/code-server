<!-- Mobile UX: Advanced Extension Tab Layout Overrides -->
<style>
  /* 1. Base Layout Constraints */
  .extension-editor {
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important; 
  }

  /* 2. Header Box & Collapse State */
  .extension-editor > .header {
    display: flex !important;
    flex-direction: row !important;
    flex-shrink: 0 !important;
    min-width: 0 !important;
    max-width: 100% !important;
    height: auto !important; 
    min-height: min-content !important;
    padding: 12px 15px 25px 15px !important; 
    box-sizing: border-box !important;
    position: relative !important;
  }
  .extension-editor > .header.header-collapsed {
    padding: 0 0 20px 0 !important; 
    background: var(--vscode-editor-background) !important;
    border-bottom: 1px solid var(--vscode-panel-border) !important;
  }
  .extension-editor > .header.header-collapsed > .icon-container,
  .extension-editor > .header.header-collapsed > .details {
    display: none !important; 
  }

  /* 3. Icon Sizing */
  .extension-editor > .header .icon-container {
    width: 50px !important; height: 50px !important; margin-right: 12px !important; flex-shrink: 0 !important;
  }
  .extension-editor > .header .icon-container .icon {
    width: 50px !important; height: 50px !important; border-radius: 6px !important;
  }

  /* 4. Details Container (Flex Column for Reordering) */
  .extension-editor > .header .details {
    display: flex !important; flex-direction: column !important; min-width: 0 !important; width: 100% !important; flex: 1 !important;
  }
  .extension-editor > .header .details > * { order: 5 !important; }

  /* 5. Fix Title Cut-off & Proper Word Wrap */
  .extension-editor > .header .details .title {
    order: 1 !important; 
    display: block !important; 
    width: 100% !important;
    margin-bottom: 4px !important; 
  }
  .extension-editor > .header .details .title .name {
    display: inline !important; 
    white-space: normal !important; 
    overflow-wrap: break-word !important; 
    word-break: break-word !important; 
    font-size: 16px !important; 
    line-height: 1.2 !important;
  }

  /* 6. Description (1-Line Clamp) */
  .extension-editor > .header .details .description {
    order: 2 !important; 
    font-size: 12px !important; 
    line-height: 1.4 !important; 
    margin: 0 0 4px 0 !important; 
    opacity: 0.85 !important;
  }
  .desc-clamped { 
    display: -webkit-box !important; -webkit-box-orient: vertical !important; -webkit-line-clamp: 1 !important; overflow: hidden !important; 
  }
  .desc-expanded { 
    display: block !important; overflow: visible !important; 
  }

  /* 7. Read More Toggle Button */
  .rm-toggle-btn {
    order: 3 !important; 
    color: var(--vscode-textLink-foreground) !important; 
    font-size: 11px !important; font-weight: 600 !important; 
    cursor: pointer !important; margin-bottom: 8px !important; 
    display: inline-block !important; align-self: flex-start !important;
  }

  /* 8. Subtitle (Metadata) */
  .extension-editor > .header .details .subtitle {
    order: 4 !important; 
    flex-wrap: wrap !important; 
    margin-bottom: 8px !important;
  }
  .meta-hidden { display: none !important; }

  /* 9. Minimize Header Arrow Bar */
  .header-toggle-arrow {
    position: absolute !important; bottom: 0 !important; left: 0 !important; width: 100% !important;
    height: 20px !important; background: var(--vscode-editor-background) !important;
    border-top: 1px solid var(--vscode-panel-border) !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
    cursor: pointer !important; font-size: 10px !important; opacity: 0.7 !important; z-index: 10 !important;
  }
  .header-toggle-arrow:active { opacity: 1 !important; background: var(--vscode-list-hoverBackground) !important; }

  /* 10. Preserve Documentation Boundaries */
  .extension-editor > .body {
    flex: 1 1 auto !important; min-height: 0 !important; overflow: hidden !important; 
  }

  /* 11. Features Tab: Convert 2-Column SplitView to 2-Row Stack */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
  }
  /* Override VS Code's inline absolute positioning */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: 100% !important; 
    height: auto !important;
    transform: none !important; 
  }
  
  /* --- TOP ROW (Navigation) --- */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child {
    flex: 0 0 auto !important;
    height: 180px !important; 
    border-bottom: 1px solid var(--vscode-panel-border) !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch !important; /* Smooth iOS scroll */
  }
  /* Force all internal containers to exactly 100% width so text doesn't arbitrarily squish */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-scrollable-element,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-rows,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-row {
    width: 100% !important;
    max-width: 100% !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-row {
    white-space: normal !important;
    word-wrap: break-word !important; 
  }

  /* --- BOTTOM ROW (Content Area) --- */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child {
    flex: 1 1 auto !important;
    height: calc(100dvh - 250px) !important; 
    overflow: auto !important; 
    -webkit-overflow-scrolling: touch !important;
    touch-action: pan-x pan-y !important;
  }
  /* Force internal elements to stretch to their true maximum width, overriding VS Code clipping */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-scrollable-element {
    overflow: auto !important;
    width: 100% !important;
    height: 100% !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-table,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-rows,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-row {
    width: max-content !important; 
    min-width: 100% !important;
  }

  /* Disable VS Code's fake scrollbars to prioritize natural scrolling */
  .extension-editor > .body .monaco-split-view2.horizontal > .sash-container,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view > .monaco-scrollable-element > .scrollbar {
    display: none !important;
  }
</style>

<script>
  window.addEventListener('load', () => {
    
    // 1. Intercept Touch Events to Enable Native Scrolling
    // This stops VS Code's internal engine from eating your swipes in the Features tab
    const unlockNativeScroll = (e) => {
      if (e.target.closest('.split-view-container > .split-view-view')) {
        e.stopPropagation();
      }
    };
    window.addEventListener('touchstart', unlockNativeScroll, { capture: true, passive: true });
    window.addEventListener('touchmove', unlockNativeScroll, { capture: true, passive: true });
    window.addEventListener('wheel', unlockNativeScroll, { capture: true, passive: true });

    // 2. Dynamic UI Overrides
    const observer = new MutationObserver(() => {
      const headers = document.querySelectorAll('.extension-editor > .header:not(.ui-processed)');
      
      headers.forEach(header => {
        header.classList.add('ui-processed');
        
        const arrowBtn = document.createElement('div');
        arrowBtn.className = 'header-toggle-arrow';
        arrowBtn.innerText = '▲ Minimize Header';
        header.appendChild(arrowBtn);

        arrowBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          header.classList.toggle('header-collapsed');
          if (header.classList.contains('header-collapsed')) {
            arrowBtn.innerText = '▼ Show Header';
          } else {
            arrowBtn.innerText = '▲ Minimize Header';
          }
        });

        const details = header.querySelector('.details');
        if (!details) return;

        const desc = details.querySelector('.description');
        const subtitle = details.querySelector('.subtitle');

        if (desc && subtitle) {
          subtitle.classList.add('meta-hidden');
          desc.classList.add('desc-clamped');

          const toggleBtn = document.createElement('div');
          toggleBtn.className = 'rm-toggle-btn';
          toggleBtn.innerText = 'Read more ▼';
          details.appendChild(toggleBtn);

          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (desc.classList.contains('desc-clamped')) {
              desc.classList.remove('desc-clamped');
              desc.classList.add('desc-expanded');
              subtitle.classList.remove('meta-hidden');
              toggleBtn.innerText = 'Read less ▲';
            } else {
              desc.classList.remove('desc-expanded');
              desc.classList.add('desc-clamped');
              subtitle.classList.add('meta-hidden');
              toggleBtn.innerText = 'Read more ▼';
            }
          });
        }
      });
    });
    
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
