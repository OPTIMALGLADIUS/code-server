<!-- Mobile UX: Header Overrides -->
<style>
  .extension-editor { display: flex !important; flex-direction: column !important; overflow: hidden !important; }
  .extension-editor > .header {
    display: flex !important; flex-direction: row !important; flex-shrink: 0 !important;
    min-width: 0 !important; max-width: 100% !important; height: auto !important; 
    padding: 12px 15px 25px 15px !important; box-sizing: border-box !important; position: relative !important;
  }
  .extension-editor > .header.header-collapsed {
    padding: 0 0 20px 0 !important; background: var(--vscode-editor-background) !important;
    border-bottom: 1px solid var(--vscode-panel-border) !important;
  }
  .extension-editor > .header.header-collapsed > .icon-container,
  .extension-editor > .header.header-collapsed > .details { display: none !important; }
  .extension-editor > .header .icon-container {
    width: 50px !important; height: 50px !important; margin-right: 12px !important; flex-shrink: 0 !important;
  }
  .extension-editor > .header .icon-container .icon { width: 50px !important; height: 50px !important; border-radius: 6px !important; }
  .extension-editor > .header .details {
    display: flex !important; flex-direction: column !important; min-width: 0 !important; width: 100% !important; flex: 1 !important;
  }
  .extension-editor > .header .details > * { order: 5 !important; }
  .extension-editor > .header .details .title {
    order: 1 !important; display: block !important; width: 100% !important; margin-bottom: 4px !important; 
  }
  .extension-editor > .header .details .title .name {
    display: inline !important; white-space: normal !important; overflow-wrap: break-word !important; 
    word-break: break-word !important; font-size: 16px !important; line-height: 1.2 !important;
  }
  .extension-editor > .header .details .description {
    order: 2 !important; font-size: 12px !important; line-height: 1.4 !important; margin: 0 0 4px 0 !important; opacity: 0.85 !important;
  }
  .desc-clamped { display: -webkit-box !important; -webkit-box-orient: vertical !important; -webkit-line-clamp: 1 !important; overflow: hidden !important; }
  .desc-expanded { display: block !important; overflow: visible !important; }
  .rm-toggle-btn {
    order: 3 !important; color: var(--vscode-textLink-foreground) !important; font-size: 11px !important; 
    font-weight: 600 !important; cursor: pointer !important; margin-bottom: 8px !important; display: inline-block !important; align-self: flex-start !important;
  }
  .extension-editor > .header .details .subtitle { order: 4 !important; flex-wrap: wrap !important; margin-bottom: 8px !important; }
  .meta-hidden { display: none !important; }
  .header-toggle-arrow {
    position: absolute !important; bottom: 0 !important; left: 0 !important; width: 100% !important; height: 20px !important; 
    background: var(--vscode-editor-background) !important; border-top: 1px solid var(--vscode-panel-border) !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
    cursor: pointer !important; font-size: 10px !important; opacity: 0.7 !important; z-index: 10 !important;
  }
  .header-toggle-arrow:active { opacity: 1 !important; background: var(--vscode-list-hoverBackground) !important; }
  .extension-editor > .body { flex: 1 1 auto !important; min-height: 0 !important; overflow: hidden !important; }
</style>
<script>
  window.addEventListener('load', () => {
    const observer = new MutationObserver(() => {
      document.querySelectorAll('.extension-editor > .header:not(.ui-processed)').forEach(header => {
        header.classList.add('ui-processed');
        const arrowBtn = document.createElement('div');
        arrowBtn.className = 'header-toggle-arrow'; arrowBtn.innerText = '▲ Minimize Header';
        header.appendChild(arrowBtn);
        arrowBtn.addEventListener('click', (e) => {
          e.stopPropagation(); header.classList.toggle('header-collapsed');
          arrowBtn.innerText = header.classList.contains('header-collapsed') ? '▼ Show Header' : '▲ Minimize Header';
        });
        const details = header.querySelector('.details');
        if (!details) return;
        const desc = details.querySelector('.description'); const subtitle = details.querySelector('.subtitle');
        if (desc && subtitle) {
          subtitle.classList.add('meta-hidden'); desc.classList.add('desc-clamped');
          const toggleBtn = document.createElement('div'); toggleBtn.className = 'rm-toggle-btn'; toggleBtn.innerText = 'Read more ▼';
          details.appendChild(toggleBtn);
          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isClamped = desc.classList.contains('desc-clamped');
            desc.classList.toggle('desc-clamped', !isClamped); desc.classList.toggle('desc-expanded', isClamped);
            subtitle.classList.toggle('meta-hidden', !isClamped); toggleBtn.innerText = isClamped ? 'Read less ▲' : 'Read more ▼';
          });
        }
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
