<!-- Mobile UX: Universal Horizontal Panning & Inverted Virtual Vertical Scroll -->
<style>
  /* =========================================
     1. BASE LAYOUT & HEADER
     ========================================= */
  .extension-editor { display: flex !important; flex-direction: column !important; overflow: hidden !important; height: 100% !important; }
  .extension-editor > .body { flex: 1 1 auto !important; min-height: 0 !important; overflow: hidden !important; position: relative !important; }
  
  .extension-editor > .header {
    display: flex !important; flex-direction: row !important; flex-shrink: 0 !important; min-width: 0 !important; max-width: 100% !important; 
    height: auto !important; min-height: min-content !important; padding: 12px 15px 25px 15px !important; box-sizing: border-box !important; position: relative !important;
  }
  .extension-editor > .header.header-collapsed { padding: 0 0 20px 0 !important; background: var(--vscode-editor-background) !important; border-bottom: 1px solid var(--vscode-panel-border) !important; }
  .extension-editor > .header.header-collapsed > .icon-container,
  .extension-editor > .header.header-collapsed > .details { display: none !important; }
  .extension-editor > .header .icon-container { width: 50px !important; height: 50px !important; margin-right: 12px !important; flex-shrink: 0 !important; }
  .extension-editor > .header .icon-container .icon { width: 50px !important; height: 50px !important; border-radius: 6px !important; }
  .extension-editor > .header .details { display: flex !important; flex-direction: column !important; min-width: 0 !important; width: 100% !important; flex: 1 !important; }
  .extension-editor > .header .details > * { order: 5 !important; }
  .extension-editor > .header .details .title { order: 1 !important; display: block !important; width: 100% !important; margin-bottom: 4px !important; }
  .extension-editor > .header .details .title .name { display: inline !important; white-space: normal !important; overflow-wrap: break-word !important; word-break: break-word !important; font-size: 16px !important; line-height: 1.2 !important; }
  .extension-editor > .header .details .description { order: 2 !important; font-size: 12px !important; line-height: 1.4 !important; margin: 0 0 4px 0 !important; opacity: 0.85 !important; }
  .desc-clamped { display: -webkit-box !important; -webkit-box-orient: vertical !important; -webkit-line-clamp: 1 !important; overflow: hidden !important; }
  .desc-expanded { display: block !important; overflow: visible !important; }
  .rm-toggle-btn { order: 3 !important; color: var(--vscode-textLink-foreground) !important; font-size: 11px !important; font-weight: 600 !important; cursor: pointer !important; margin-bottom: 8px !important; display: inline-block !important; align-self: flex-start !important; }
  .extension-editor > .header .details .subtitle { order: 4 !important; flex-wrap: wrap !important; margin-bottom: 8px !important; }
  .meta-hidden { display: none !important; }
  .header-toggle-arrow { position: absolute !important; bottom: 0 !important; left: 0 !important; width: 100% !important; height: 20px !important; background: var(--vscode-editor-background) !important; border-top: 1px solid var(--vscode-panel-border) !important; display: flex !important; align-items: center !important; justify-content: center !important; cursor: pointer !important; font-size: 10px !important; opacity: 0.7 !important; z-index: 10 !important; }
  .header-toggle-arrow:active { opacity: 1 !important; background: var(--vscode-list-hoverBackground) !important; }

  /* =========================================
     2. FEATURES TAB: UNIVERSAL X-AXIS PANNING
     ========================================= */
  /* Make the global scrollable element handle horizontal swiping */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element {
    overflow-x: auto !important; 
    overflow-y: hidden !important; 
    width: 100vw !important;
    touch-action: pan-x !important;
    -webkit-overflow-scrolling: touch !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container {
    display: flex !important; flex-direction: column !important; 
    width: max-content !important; /* CRITICAL: Allows the wrapper to infinitely stretch right */
    min-width: 100vw !important; height: 100% !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view {
    position: relative !important; top: auto !important; left: auto !important; transform: none !important; 
  }

  /* --- TOP ROW (Sticky Navigation) --- */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child {
    flex: 0 0 auto !important; height: 180px !important; border-bottom: 1px solid var(--vscode-panel-border) !important;
    width: 100vw !important; min-width: 100vw !important; max-width: 100vw !important;
    /* Keeps this row locked in view while the user pans horizontally to see the bottom row texts */
    position: sticky !important; left: 0 !important; z-index: 5 !important; background: var(--vscode-editor-background) !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-scrollable-element,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-rows,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-row {
    width: 100vw !important; min-width: 100vw !important; max-width: 100vw !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:first-child .monaco-list-row {
    white-space: normal !important; word-break: break-word !important; padding-right: 20px !important; 
  }

  /* --- BOTTOM ROW (Infinite Command/Settings Stretch) --- */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child {
    flex: 1 1 auto !important; height: auto !important; min-height: 0 !important; 
    width: max-content !important; min-width: 100vw !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-scrollable-element {
    overflow: hidden !important; width: 100% !important; height: 100% !important;
  }
  
  /* Destroy VS Code's inline clipping styles */
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-table,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-rows {
    width: max-content !important; min-width: 100vw !important; display: block !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-row {
    display: flex !important; width: max-content !important; min-width: 100vw !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-row > div,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-table-td {
    width: max-content !important; min-width: max-content !important; max-width: none !important;
    flex: 0 0 auto !important; padding-right: 40px !important; overflow: visible !important;
  }
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view:last-child .monaco-list-row * {
    white-space: nowrap !important; text-overflow: clip !important;
  }

  /* Hide synthetic scrollbars and sashes */
  .extension-editor > .body .monaco-split-view2.horizontal > .sash-container,
  .extension-editor > .body .monaco-split-view2.horizontal > .monaco-scrollable-element > .split-view-container > .split-view-view > .monaco-scrollable-element > .scrollbar { display: none !important; }
</style>

<script>
  window.addEventListener('load', () => {
    
    // =========================================
    // SMART AXIS HYBRID SCROLL ENGINE
    // =========================================
    let lastY = 0;
    let lastX = 0;
    let isTouching = false;

    window.addEventListener('touchstart', (e) => {
      // Capture swipes on the overarching split-view container (applies to both rows)
      const target = e.target.closest('.split-view-container');
      if (target) {
        isTouching = true;
        lastY = e.touches[0].clientY;
        lastX = e.touches[0].clientX;
      }
    }, { capture: true, passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      
      const target = e.target.closest('.split-view-container');
      if (target) {
        const currentY = e.touches[0].clientY;
        const currentX = e.touches[0].clientX;
        
        // Retained Inverted Deltas
        const deltaY = currentY - lastY;
        const deltaX = currentX - lastX;
        
        lastY = currentY;
        lastX = currentX;

        // Axis Detection: Does the user want to scroll Up/Down or Left/Right?
        if (Math.abs(deltaY) > Math.abs(deltaX)) {
          // VERTICAL SWIPE: Feed the Virtual Engine to scroll internal lists
          const viewTarget = e.target.closest('.split-view-view') || target;
          const wheelEvent = new WheelEvent('wheel', {
            deltaY: deltaY * 2.5, 
            deltaX: 0, 
            clientX: currentX, 
            clientY: currentY,
            bubbles: true,
            cancelable: true
          });
          
          viewTarget.dispatchEvent(wheelEvent);
          if (e.cancelable) e.preventDefault(); 
        } else {
          // HORIZONTAL SWIPE: Stop VS Code from intervening, let the browser slide the overflow-x natively
          e.stopPropagation(); 
        }
      }
    }, { capture: true, passive: false });

    window.addEventListener('touchend', () => {
      isTouching = false;
    }, { capture: true, passive: true });
    
    // =========================================
    // HEADER & READ MORE DYNAMICS
    // =========================================
    const observer = new MutationObserver(() => {
      const headers = document.querySelectorAll('.extension-editor > .header:not(.ui-processed)');
      
      headers.forEach(header => {
        header.classList.add('ui-processed');
        
        const arrowBtn = document.createElement('div');
        arrowBtn.className = 'header-toggle-arrow';
        arrowBtn.innerText = '▲ Minimize Header';
        header.appendChild(arrowBtn);

        arrowBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          header.classList.toggle('header-collapsed');
          if (header.classList.contains('header-collapsed')) {
            arrowBtn.innerText = '▼ Show Header';
          } else {
            arrowBtn.innerText = '▲ Minimize Header';
          }
        });

        const details = header.querySelector('.details');
        if (!details) return;

        const desc = details.querySelector('.description');
        const subtitle = details.querySelector('.subtitle');

        if (desc && subtitle) {
          subtitle.classList.add('meta-hidden');
          desc.classList.add('desc-clamped');

          const toggleBtn = document.createElement('div');
          toggleBtn.className = 'rm-toggle-btn';
          toggleBtn.innerText = 'Read more ▼';
          details.appendChild(toggleBtn);

          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (desc.classList.contains('desc-clamped')) {
              desc.classList.remove('desc-clamped');
              desc.classList.add('desc-expanded');
              subtitle.classList.remove('meta-hidden');
              toggleBtn.innerText = 'Read less ▲';
            } else {
              desc.classList.remove('desc-expanded');
              desc.classList.add('desc-clamped');
              subtitle.classList.add('meta-hidden');
              toggleBtn.innerText = 'Read more ▼';
            }
          });
        }
      });
    });
    
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
