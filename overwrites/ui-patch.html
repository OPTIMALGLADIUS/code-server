<!-- Mobile UX Locks & Auto-Collapse Sidebar -->
<style>
  html, body, .monaco-workbench { position: fixed !important; top: 0 !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100vw !important; height: 100dvh !important; overflow: hidden !important; }
  .editor-instance, .monaco-scrollable-element { touch-action: pan-x pan-y !important; }
</style>
<script>
  window.addEventListener('load', () => {
    const collapse = () => {
      const sidebar = document.querySelector('.part.sidebar');
      if (sidebar && sidebar.offsetWidth > 10) {
        // Find the currently active tab in the activity bar
        const activeTab = document.querySelector('.part.activitybar .action-item.checked');
        if (activeTab) {
          // Dispatch a full suite of mouse events to bypass VS Code's internal event filtering
          activeTab.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
          activeTab.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true }));
          activeTab.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        }
      }
    };

    // Use 'pointerdown' in the capture phase to intercept mobile touches before Monaco Editor swallows them
    window.addEventListener('pointerdown', (e) => {
      // If tapping inside the code editor area
      if (e.target.closest('.part.editor')) {
        collapse();
      } 
      // If tapping a file, extension, or search result row in the sidebar
      else if (e.target.closest('.part.sidebar .monaco-list-row')) {
        // Do not collapse if touching an expand/collapse arrow (twistie)
        if (!e.target.closest('.monaco-tl-twistie, .collapsible')) {
          setTimeout(collapse, 350);
        }
      }
    }, { capture: true, passive: true });
  });
</script>
